<div class="scroll"><table><tr><th>Заказ</th><th>Клиент</th><th>Этап</th><th></th></tr>{% for order in orders %}<tr><td>№ {{ order.pk }} · {{ order.title }}</td><td>{{ order.client.name }}</td><td><span class="badge badge-{{ order.status }}">{% if order.completed_free %}Выполнен · бесплатно{% else %}{{ order.display_status }}{% endif %}</span></td><td><a href="/orders/{{ order.pk }}/">Открыть ↗</a></td></tr>{% empty %}<tr><td colspan="4">Заказов пока нет.</td></tr>{% endfor %}</table></div>
